# Nginx site for the API. Install: /etc/nginx/sites-available/spotter (+ symlink in sites-enabled).
# certbot --nginx adds the HTTPS server block and the HTTP -> HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name 65-2-172-227.sslip.io;

    # Only the API lives here; the web app is served by Vercel, which forwards /api/* to this host.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;  # long truck routes can take TomTom 15+ s; gunicorn allows 120 s
    }

    location / {
        return 404;
    }
}
